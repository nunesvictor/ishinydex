# iShinyDex completo com um comando:
#   cp .env.example .env   # e troque os valores change-me
#   docker compose up -d --build
# App em http://<host>:${X_WEB_PORT:-8090} (o nginx do frontend também repassa
# /api, /admin, /static e /media para o backend pela rede interna).

name: ishinydex

services:
  # One-shot: popula o volume `sprites` (só reescreve quando a versão muda).
  sprites:
    build:
      context: ./backend
      target: sprites-data
      args:
        # 0 = sem compressão pngquant (build bem mais rápido; usado no CI).
        SPRITES_OPTIMIZE: ${SPRITES_OPTIMIZE:-1}
    image: ishinydex-sprites:latest
    restart: "no"
    volumes:
      - sprites:/data

  db:
    # Mesma versão do backend: precisa bater com o pg_dump/pg_restore da imagem.
    image: postgres:17-alpine
    # Usuário, senha e nome do banco vêm do .env (POSTGRES_*); sem senha, o
    # próprio postgres recusa subir e diz o motivo no log.
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    volumes:
      - data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: prod
    image: ishinydex-backend:latest
    # Aplica as migrations (nada a fazer num banco já migrado/restaurado) e
    # sobe o uWSGI.
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec uwsgi --ini uwsgi/ishinydex.ini
    depends_on:
      db:
        condition: service_healthy
      sprites:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DEBUG: "False"
      DEBUG_TOOLBAR: "False"
    restart: unless-stopped
    volumes:
      - ./backups:/home/guest/ishinydex/backups
      - pokeapi-cache:/home/guest/ishinydex/.cache
      - sprites:/home/guest/ishinydex/src/media/sprites:ro

  frontend:
    build:
      context: ./frontend
    image: ishinydex-frontend:latest
    depends_on:
      - backend
    environment:
      # Rede interna do compose: sem host.docker.internal.
      BACKEND_URL: http://backend:8000
    ports:
      - "${X_WEB_PORT:-8090}:80"
    restart: unless-stopped

volumes:
  data:
  sprites:
  pokeapi-cache:
