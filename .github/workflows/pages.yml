# Publica a pasta site/ no GitHub Pages (https://<dono>.github.io/<repositório>/).
#
# Por enquanto só à mão (Actions → Pages → Run workflow): o site tem uma
# página provisória e o protótipo da etapa 0 (#53). Na etapa 2 de #48, este
# workflow passa a buildar o app e a publicar a cada tag de versão (#51).
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais nova vale.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
