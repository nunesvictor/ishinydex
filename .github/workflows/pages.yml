# Publica no GitHub Pages (https://<dono>.github.io/<repositório>/) o app,
# montado por tool/build_pages.sh: o modo local na raiz, a demonstração em
# /demo/ e as páginas fixas de site/ (a política de privacidade e o
# protótipo /spike/dropbox/ da #53).
#
# Só versões marcadas (#51): dispara com uma tag v* (criada por
# tool/release.py) ou à mão (Actions → Pages → Run workflow), nunca a cada
# merge na main. À mão dá para escolher o que publicar (uma tag, por
# exemplo, para republicar uma versão).
name: Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch ou commit a publicar (vazio: o escolhido acima)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais nova vale.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # A mesma versão do CI e do Dockerfile do frontend.
  FLUTTER_VERSION: 3.47.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true
          # Histórico e tags para o `git describe` de uma execução à mão.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Montar o site
        env:
          # Variável do repositório (pública); vazia, o app sai sem sync.
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
        run: |
          version=$(git describe --tags)
          tool/build_pages.sh "$version" "/${{ github.event.repository.name }}/" _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        env:
          # O Pages identifica cada publicação por este valor (o padrão é o
          # commit). Duas publicações do mesmo commit, como uma à mão e logo
          # depois a da tag, viram uma só e a segunda não troca o site; por
          # isso cada execução ganha a sua.
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
