name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Desde a v2.0.0 não há stack para subir (o deploy é o GitHub Pages; ver
  # pages.yml). Fica a regra dos submodules e a sintaxe dos scripts.
  checks:
    name: Submodules e scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Os submodules só apontam para commits da main de cada repositório:
      # o commit de um PR fica órfão depois do squash merge.
      - name: Submodules na main
        run: |
          for module in backend frontend; do
            git -C "$module" fetch --quiet origin main
            if ! git -C "$module" merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$module aponta para $(git -C "$module" rev-parse --short HEAD), fora da main."
              exit 1
            fi
          done

      - name: Scripts
        run: |
          bash -n tool/build_pages.sh
          python3 -m py_compile tool/release.py
