name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: Stack completa (docker compose)
    runs-on: ubuntu-latest
    env:
      # Sem compressão dos sprites e sem wasm: o CI só precisa ver a stack
      # subir (o build com wasm é coberto no frontend e no Pages).
      SPRITES_OPTIMIZE: "0"
      X_WEB_WASM: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Valores aleatórios a cada execução (nada com cara de segredo no repo).
      - name: Gerar .env de teste
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" \
            -e "s/^DJANGO_SUPERUSER_PASSWORD=.*/DJANGO_SUPERUSER_PASSWORD=$(openssl rand -hex 12)/" \
            .env

      - name: Validar o compose
        run: docker compose config --quiet

      # As imagens do compose, com cache das camadas no GitHub Actions: o SDK
      # do Flutter, as dependências e os sprites só são refeitos quando mudam.
      # Um escopo por imagem, para uma não sobrescrever o cache da outra.
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          load: true
          # Só a main exporta o cache (#66): no PR, a exportação custava
          # minutos e o cache não serve a ninguém depois do squash. Linha
          # vazia é ignorada; os PRs leem o cache da main.
          set: |
            sprites.cache-from=type=gha,scope=sprites
            ${{ github.event_name == 'push' && 'sprites.cache-to=type=gha,scope=sprites,mode=max' || '' }}
            backend.cache-from=type=gha,scope=backend
            ${{ github.event_name == 'push' && 'backend.cache-to=type=gha,scope=backend,mode=max' || '' }}
            frontend.cache-from=type=gha,scope=frontend
            ${{ github.event_name == 'push' && 'frontend.cache-to=type=gha,scope=frontend,mode=max' || '' }}

      - name: Subir
        run: docker compose up -d --no-build

      - name: App e API respondendo
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null localhost:8090/ && break
            sleep 5
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/)" = 200
          # API exige login: 401 prova que o nginx chega ao backend migrado.
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/api/)
            [ "$code" = 401 ] && break
            sleep 5
          done
          echo "api: $code"
          test "$code" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/admin/login/)" = 200

      - name: Logs (se falhar)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar
        if: always()
        run: docker compose down -v
